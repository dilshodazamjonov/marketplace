# Serves the static frontend and forwards /api/* to FastAPI, so the browser only ever talks to
# one origin: no CORS needed, and HttpOnly auth cookies will just work once the API sets them.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Keep redirects relative (e.g. /admin -> /admin/) so they stay on the published port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Only same-origin scripts, styles and requests; no inline scripts, no framing.
    # This is what keeps the session token in sessionStorage out of reach of injected code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Revalidate on every load so edits to the mounted files show up immediately.
    add_header Cache-Control "no-cache" always;

    location /api/ {
        # The trailing slash strips the prefix: /api/auth/login -> http://api:8000/auth/login
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API scopes the refresh-token cookie to Path=/auth; here the browser sees those
        # endpoints under /api/auth, so rewrite the path or the cookie would never be sent.
        proxy_cookie_path /auth /api/auth;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
